services:
  busy-bar:
    image: ghcr.io/djensenius/telephone-booth-busy-bar:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      BUSY_BAR_MONITOR_ENABLED: "true"
      BUSY_BAR_CLOUD_TOKEN: "${BUSY_BAR_CLOUD_TOKEN:?Set BUSY_BAR_CLOUD_TOKEN}"
      BUSY_BAR_API_URL: "${BUSY_BAR_API_URL:-https://api.busy.app}"
      BUSY_BAR_CLOUD_WS_URL: "${BUSY_BAR_CLOUD_WS_URL:-wss://api.busy.app/api/v1/bars/ws}"

      BUSY_BAR_OPERATOR_API_URL: "${BUSY_BAR_OPERATOR_API_URL:?Set BUSY_BAR_OPERATOR_API_URL}"
      BUSY_BAR_OPERATOR_TOKEN: "${BUSY_BAR_OPERATOR_TOKEN:?Set BUSY_BAR_OPERATOR_TOKEN}"
      BUSY_BAR_BOOTH_ID: "${BUSY_BAR_BOOTH_ID:-booth-01}"

      BUSY_BAR_DEVICE_ID: "${BUSY_BAR_DEVICE_ID:-}"
      BUSY_BAR_APPLICATION_NAME: "${BUSY_BAR_APPLICATION_NAME:-telephone-booth-monitor}"
      BUSY_BAR_DISPLAY_PRIORITY: "${BUSY_BAR_DISPLAY_PRIORITY:-100}"
      BUSY_BAR_STATUS_STALE_AFTER_SECONDS: "${BUSY_BAR_STATUS_STALE_AFTER_SECONDS:-75}"
      BUSY_BAR_SYSTEM_STALE_AFTER_SECONDS: "${BUSY_BAR_SYSTEM_STALE_AFTER_SECONDS:-20}"
      BUSY_BAR_RENDER_DEBOUNCE_MS: "${BUSY_BAR_RENDER_DEBOUNCE_MS:-250}"
      BUSY_BAR_FRONT_ROTATION_SECONDS: "${BUSY_BAR_FRONT_ROTATION_SECONDS:-8}"
      BUSY_BAR_SUMMARY_POLL_SECONDS: "${BUSY_BAR_SUMMARY_POLL_SECONDS:-30}"
      BUSY_BAR_TIME_ZONE: "${BUSY_BAR_TIME_ZONE:-America/Toronto}"

      BUSY_BAR_AUDIO_ENABLED: "${BUSY_BAR_AUDIO_ENABLED:-false}"
      BUSY_BAR_ALERT_SOUND: "${BUSY_BAR_ALERT_SOUND:-}"
      BUSY_BAR_ALERT_COOLDOWN_SECONDS: "${BUSY_BAR_ALERT_COOLDOWN_SECONDS:-300}"
